# Test backtranslation emphasis/typeform detection
#
# This tests that emphasis indicators in braille are correctly
# recognized and the typeform buffer is populated during backtranslation.
#
# The expected_typeform option specifies the expected typeform output
# for each character position. Use emphasis class names (italic, bold,
# underline) with '+' for emphasized and ' ' for plain text.

display: tables/unicode-without-blank.dis
table: tables/en-ueb-g1.ctb

flags:
  testmode: backward

tests:
  - # plain text - no emphasis
    - "⠓⠑⠇⠇⠕"
    - "hello"

  - # single letter italic (dots 46-23)
    - "⠨⠆⠞⠑⠎⠞"
    - "test"
    - expected_typeform:
        italic: '+   '

  - # single letter bold (dots 45-23)
    - "⠘⠆⠞⠑⠎⠞"
    - "test"
    - expected_typeform:
        bold: '+   '

  - # single letter underline (dots 456-23)
    - "⠸⠆⠞⠑⠎⠞"
    - "test"
    - expected_typeform:
        underline: '+   '

  - # word italic with explicit terminator
    - "⠨⠂⠺⠕⠗⠙⠨⠄"
    - "word"
    - expected_typeform:
        italic: '++++'

  - # word bold with explicit terminator
    - "⠘⠂⠺⠕⠗⠙⠘⠄"
    - "word"
    - expected_typeform:
        bold: '++++'

  - # word underline with explicit terminator
    - "⠸⠂⠺⠕⠗⠙⠸⠄"
    - "word"
    - expected_typeform:
        underline: '++++'

  - # phrase italic spanning multiple words
    - "⠨⠶⠓⠊ ⠞⠓⠑⠗⠑⠨⠄"
    - "hi there"
    - expected_typeform:
        italic: '++++++++'

  - # mixed text with letter italic in middle
    - "⠁⠨⠆⠃⠉"
    - "abc"
    - expected_typeform:
        italic: ' + '

  - # word emphasis followed by plain text
    - "⠨⠂⠓⠊⠨⠄ ⠞⠓⠑⠗⠑"
    - "hi there"
    - expected_typeform:
        italic: '++      '

  - # nested emphasis - bold word inside italic phrase
    - "⠨⠶⠓⠊ ⠘⠂⠃⠕⠇⠙⠘⠄ ⠞⠓⠑⠗⠑⠨⠄"
    - "hi bold there"
    - expected_typeform:
        italic: '+++++++++++++'
        bold: '   ++++      '

  - # multiple word emphasis - italic and bold on same word
    - "⠨⠂⠘⠂⠞⠑⠎⠞⠘⠄⠨⠄"
    - "test"
    - expected_typeform:
        italic: '++++'
        bold: '++++'

  - # letter underline inside word italic
    - "⠨⠂⠞⠸⠆⠑⠎⠞⠨⠄"
    - "test"
    - expected_typeform:
        italic: '++++'
        underline: ' +  '

  - # three letter emphasis types on first character
    - "⠨⠆⠸⠆⠘⠆⠞⠑⠎⠞"
    - "test"
    - expected_typeform:
        italic: '+   '
        underline: '+   '
        bold: '+   '

  # === Edge Case Tests ===

  - # emphasis type transition within word
    - "⠨⠂⠁⠃⠨⠄⠘⠂⠉⠙⠘⠄"
    - "abcd"
    - expected_typeform:
        italic: '++  '
        bold: '  ++'

  - # punctuation at end of word emphasis
    - "⠨⠂⠞⠑⠎⠞⠖⠨⠄"
    - "test!"
    - expected_typeform:
        italic: '+++++'

  - # word emphasis at end of input (no terminator)
    - "⠨⠂⠞⠑⠎⠞"
    - "test"
    - expected_typeform:
        italic: '++++'

  - # phrase emphasis at end of input (no terminator)
    - "⠨⠶⠓⠑⠇⠇⠕"
    - "hello"
    - expected_typeform:
        italic: '+++++'

  - # letter emphasis at end of input (no character follows)
    - "⠁⠨⠆"
    - "a"
    - expected_typeform:
        italic: ' '

  - # single character letter emphasis
    - "⠨⠆⠁ ⠃⠉"
    - "a bc"
    - expected_typeform:
        italic: '+   '

  - # letter emphasis followed by word emphasis
    - "⠨⠆⠞⠘⠂⠑⠎⠞⠘⠄"
    - "test"
    - expected_typeform:
        italic: '+   '
        bold: ' +++'

  - # phrase emphasis with mixed punctuation
    - "⠨⠶⠓⠊⠂ ⠞⠓⠑⠗⠑⠖⠨⠄"
    - "hi, there!"
    - expected_typeform:
        italic: '++++++++++'

  - # empty input between emphasis indicators
    - "⠨⠂⠨⠄"
    - ""
    - expected_typeform:
        italic: ''

  - # bold phrase containing italic word
    - "⠘⠶⠁ ⠨⠂⠃⠨⠄ ⠉⠘⠄"
    - "a b c"
    - expected_typeform:
        bold: '+++++'
        italic: '  +  '

# Grade 2 contraction tests - verify emphasis applies to all expanded characters
table: tables/en-ueb-g2.ctb

flags:
  testmode: backward

tests:
  - # contraction "the" with word italic - all 3 chars get emphasis
    - "⠨⠂⠮⠨⠄"
    - "the"
    - expected_typeform:
        italic: '+++'

  - # contraction "and" with word bold - all 3 chars get emphasis
    - "⠘⠂⠯⠘⠄"
    - "and"
    - expected_typeform:
        bold: '+++'

  - # contraction "for" with letter italic - all 3 chars get emphasis
    - "⠨⠆⠿"
    - "for"
    - expected_typeform:
        italic: '+++'

  - # phrase emphasis spanning multiple contractions
    - "⠨⠶⠮ ⠯⠨⠄"
    - "the and"
    - expected_typeform:
        italic: '+++++++'

  - # mixed contractions and regular letters with word emphasis
    - "⠨⠂⠮⠗⠑⠨⠄"
    - "there"
    - expected_typeform:
        italic: '+++++'

  - # letter emphasis on contraction followed by plain text
    - "⠨⠆⠮ ⠺⠕⠗⠙"
    - "the word"
    - expected_typeform:
        italic: '+++     '

  - # word emphasis contraction with implicit space termination
    - "⠨⠂⠮ ⠯"
    - "the and"
    - expected_typeform:
        italic: '++++   '

# === Additional Edge Case Tests ===

# Reset to Grade 1 for more edge case tests
table: tables/en-ueb-g1.ctb

flags:
  testmode: backward

tests:
  - # punctuation followed by space - does punctuation act as word boundary?
    # begemphword + "hi" + period + space + "no"
    # Currently only space clears word emphasis, so period should retain emphasis
    - "⠨⠂⠓⠊⠲ ⠝⠕"
    - "hi. no"
    - expected_typeform:
        italic: '++++  '

  - # consecutive word emphasis blocks (same type)
    # Two separate italic word blocks: "ab" italic, space, "cd" italic
    - "⠨⠂⠁⠃⠨⠄ ⠨⠂⠉⠙⠨⠄"
    - "ab cd"
    - expected_typeform:
        italic: '++ ++'

  - # consecutive word emphasis blocks (different types)
    # Italic word "ab", space, bold word "cd"
    - "⠨⠂⠁⠃⠨⠄ ⠘⠂⠉⠙⠘⠄"
    - "ab cd"
    - expected_typeform:
        italic: '++   '
        bold: '   ++'

  - # multiple consecutive spaces
    # Word italic "ab" + multiple spaces + plain "cd"
    - "⠨⠂⠁⠃ ⠀⠀⠉⠙"
    - "ab   cd"
    - expected_typeform:
        italic: '+++    '

  - # word emphasis implicit termination followed by NEW word emphasis
    # italic "hello" + space (implicit termination) + bold "name" + space + plain "is"
    - "⠨⠂⠓⠑⠇⠇⠕ ⠘⠂⠝⠁⠍⠑⠘⠄ ⠊⠎"
    - "hello name is"
    - expected_typeform:
        italic: '++++++       '
        bold: '      ++++   '

  - # punctuation immediately followed by new emphasis (no space)
    # Word italic "hi" + comma + immediately start bold "no"
    - "⠨⠂⠓⠊⠂⠨⠄⠘⠂⠝⠕⠘⠄"
    - "hi,no"
    - expected_typeform:
        italic: '+++  '
        bold: '   ++'

  - # different emphasis types in sequence separated by space
    # Italic "ab" + space + bold "cd" + space + underline "ef"
    - "⠨⠂⠁⠃⠨⠄ ⠘⠂⠉⠙⠘⠄ ⠸⠂⠑⠋⠸⠄"
    - "ab cd ef"
    - expected_typeform:
        italic: '++      '
        bold: '   ++   '
        underline: '      ++'

  - # word emphasis without explicit terminator, followed by new word emphasis after space
    # italic "ab" + space (implicit termination) + bold "cd"
    - "⠨⠂⠁⠃ ⠘⠂⠉⠙⠘⠄"
    - "ab cd"
    - expected_typeform:
        italic: '+++  '
        bold: '   ++'

  - # comma between two emphasized words with restart
    # italic "hi" + comma + space + italic "no" (restart emphasis)
    - "⠨⠂⠓⠊⠂ ⠨⠂⠝⠕⠨⠄"
    - "hi, no"
    - expected_typeform:
        italic: '++++++'

  - # phrase emphasis spanning punctuation and multiple words
    # Tests that phrase emphasis is NOT cleared by space
    - "⠨⠶⠁⠲ ⠃⠲ ⠉⠨⠄"
    - "a. b. c"
    - expected_typeform:
        italic: '+++++++'

  - # empty word (only space between emphasis indicators)
    - "⠨⠂ ⠨⠄"
    - " "
    - expected_typeform:
        italic: '+'

  - # word emphasis at word boundary with following plain text
    # Tests precise boundary handling
    - "⠨⠂⠁⠃⠉⠨⠄ ⠙⠑⠋"
    - "abc def"
    - expected_typeform:
        italic: '+++    '

  - # two consecutive letter emphasis indicators (different types)
    # italic letter + bold letter on first char
    - "⠨⠆⠘⠆⠁⠃⠉"
    - "abc"
    - expected_typeform:
        italic: '+  '
        bold: '+  '

  - # phrase italic with word bold inside, word bold terminated by space
    # phrase covers all, word bold on "hi" + space (emphasis applied before clearing at space)
    - "⠨⠶⠘⠂⠓⠊ ⠞⠓⠑⠗⠑⠨⠄"
    - "hi there"
    - expected_typeform:
        italic: '++++++++'
        bold: '+++     '

  - # multiple word emphasis blocks with no content between
    # italic word terminator immediately followed by bold word start
    - "⠨⠂⠁⠃⠨⠄⠘⠂⠉⠙⠘⠄"
    - "abcd"
    - expected_typeform:
        italic: '++  '
        bold: '  ++'

  - # phrase bold terminated correctly (endemph ambiguity)
    # In UEB, endemphword and endemphphrase bold share the same dot pattern (45-3).
    # The backtranslator must end phrase emphasis, not just word emphasis.
    - "⠘⠶⠓⠑⠇⠇⠕⠘⠄ ⠺⠕⠗⠇⠙"
    - "hello world"
    - expected_typeform:
        bold: '+++++      '

  - # phrase bold followed by multiple plain words
    - "⠘⠶⠓⠊⠘⠄ ⠍⠽ ⠝⠁⠍⠑"
    - "hi my name"
    - expected_typeform:
        bold: '++        '

# ---------------------------------------------------------------------------
# Emphasis indicators are consumed whether or not the caller asks for the
# typeform (issue #2183). The tests without expected_typeform run without a
# typeform buffer and must give the same text as the ones with it.
# ---------------------------------------------------------------------------

table: tables/en-ueb-g1.ctb

flags:
  testmode: backward

tests:
  - # the example from issue #2183: word italic, no typeform requested
    - "⠨⠂⠺⠕⠗⠙⠨⠄"
    - "word"

  - # phrase italic, no typeform requested
    - "⠨⠶⠓⠊ ⠞⠓⠑⠗⠑⠨⠄ ⠝⠕⠺"
    - "hi there now"

  - # fragment that starts inside a phrase: the terminator is still consumed
    - "⠞⠓⠑⠗⠑⠨⠄ ⠝⠕⠺"
    - "there now"

  - # letter italic, no typeform requested
    - "⠨⠆⠞⠑⠎⠞"
    - "test"

  - # word italic around a number
    - "⠨⠂⠼⠁⠃⠨⠄"
    - "12"

  - # word italic around a capital letter, with and without typeform
    - "⠨⠂⠠⠺⠕⠗⠙⠨⠄"
    - "Word"

  - - "⠨⠂⠠⠺⠕⠗⠙⠨⠄"
    - "Word"
    - expected_typeform:
        italic: '++++'

# EBAE: one cell does several jobs. Dots 46 is the italic word indicator, the
# "before" phrase terminator (it precedes the last word of the phrase) and the
# decimal point; dots 6-3 ends both a capsword and word emphasis.

table: tables/en-us-g2.ctb

flags:
  testmode: backward

tests:
  - # single italic sign before a word: word indicator, with and without typeform
    - "⠎⠁⠽ ⠨⠘⠺"
    - "say word"

  - - "⠎⠁⠽ ⠨⠘⠺"
    - "say word"
    - expected_typeform:
        italic: '    ++++'

  - # termination sign 6-3 ends the italics before the period (no capsword open)
    - "⠎⠁⠽ ⠨⠘⠺⠠⠄⠲"
    - "say word."

  - - "⠎⠁⠽ ⠨⠘⠺⠠⠄⠲"
    - "say word."
    - expected_typeform:
        italic: '    ++++ '

  - # italics ending in the middle of a word
    - "⠨⠺⠕⠠⠄⠗⠙"
    - "word"

  - - "⠨⠺⠕⠠⠄⠗⠙"
    - "word"
    - expected_typeform:
        italic: '++  '

  - # the same termination sign ends a capsword
    - "⠠⠠⠺⠕⠠⠄⠗⠙ ⠽⠑⠎"
    - "WOrd yes"

  - # phrase: double sign before the first word, single sign before the last
    # word, which stays italic to its end
    - "⠨⠨⠓⠊ ⠐⠮ ⠝⠪ ⠨⠮⠝"
    - "hi there now then"

  - - "⠨⠨⠓⠊ ⠐⠮ ⠝⠪ ⠨⠮⠝"
    - "hi there now then"
    - expected_typeform:
        italic: '+++++++++++++++++'

  - - "⠨⠨⠓⠊ ⠐⠮ ⠝⠪ ⠨⠮⠝ ⠽⠑⠎"
    - "hi there now then yes"

  - # dots 46 as decimal point
    - "⠘⠺⠲ ⠼⠨⠑"
    - "word. .5"

# Danish 1993: dots 56 is begemphphrase, endemphphrase (after) and the
# diaeresis. The indicator is taken where it precedes or follows text, the
# diaeresis where it stands on its own.

table: tables/da-dk-g18_1993.ctb

flags:
  testmode: backward

tests:
  - - "⠰"
    - "¨"

  - - "⠁⠃⠉ ⠰ ⠙⠑⠋"
    - "abc ¨ def"

  - - "⠰⠁⠃⠉ ⠙⠑⠋⠰ ⠛⠓"
    - "abc def gh"

  - - "⠰⠁⠃⠉ ⠙⠑⠋⠰ ⠛⠓"
    - "abc def gh"
    - expected_typeform:
        italic: '+++++++   '

  - - "⠰⠁⠃⠰ ⠙⠑⠋ ⠛⠓"
    - "ab def gh"

  - - "⠰⠁⠃⠰ ⠙⠑⠋ ⠛⠓"
    - "ab def gh"
    - expected_typeform:
        italic: '++       '

  - # genuinely ambiguous ("¨abc" is written the same way): the indicator wins
    - "⠰⠁⠃⠉"
    - "abc"

# Norwegian: dots 16 is both the subscript indicator and the letter å. A letter
# is never read as an indicator, so the subscript is lost rather than the letter.
# Dots 46 is both the superscript indicator and "^": the indicator wins.

table: tables/no-no-g0.utb

flags:
  testmode: backward

tests:
  - - "⠎⠡ ⠃⠇⠡⠎⠑⠗"
    - "så blåser"

  - - "⠭⠡⠼⠃ ⠽⠡⠼⠉"
    - "xå2 yå3"

  - - "⠭⠡⠼⠃ ⠽⠡⠼⠉"
    - "xå2 yå3"
    - expected_typeform:
        sub: '       '

  - - "⠏⠡⠨⠼⠃"
    - "på2"
    - expected_typeform:
        super: '  +'

# Ukrainian: dots 12456 is the letter ґ and, through the included Russian
# table, the bold phrase indicator. The letter wins.

display: tables/ru-unicode.dis
table: tables/uk.utb

flags:
  testmode: backward

tests:
  - - "⠝⠁ ⠻⠁⠝⠅⠥"
    - "на ґанку"

# German: dots 6 is both endcapsword and the apostrophe. It only ends a capsword
# while one is open.

display: tables/unicode-without-blank.dis
table: tables/de-g0-detailed.utb

flags:
  testmode: backward

tests:
  - - "⠠⠁⠃⠉⠠ ⠘⠁⠃⠉⠠⠙ ⠘⠁⠃⠉ ⠠⠁"
    - "'abc' ABCd ABC 'a"

  - - "⠸⠸⠑⠊⠝ ⠵⠺⠑⠊ ⠙⠗⠑⠊⠠⠄ ⠧⠊⠑⠗"
    - "ein zwei drei vier"

  - - "⠸⠸⠑⠊⠝ ⠵⠺⠑⠊ ⠙⠗⠑⠊⠠⠄ ⠧⠊⠑⠗"
    - "ein zwei drei vier"
    - expected_typeform:
        italic: '+++++++++++++     '

# Hindi: dots 46 is the letter ख as well as the italic indicator inherited from
# the English table. The letter rule precedes the indicator in the table.

table: tables/hi-in-g1.utb

flags:
  testmode: backward

tests:
  - - "⠨⠁ ⠁⠨"
    - "खअ अख"
