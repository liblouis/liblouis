# Test for common Hebrew characters
#
# he-common-consonants.uti includes character definitions for consonants,
# which are identical between modern and biblical Hebrew.
# he-common-vowels-ihbc.uti defines vowels and cantillation marks
# that are shared by all biblical Hebrew tables but not by modern Hebrew.

table: he-common-consonants.uti
table: {language: hbo, system: IHBC, __assert-match: hbo.utb}
table: {language: hbo, system: IHBC-McAllister, __assert-match: hbo-cantillated.utb}
table: {language: hbo, system: Katz, __assert-match: hbo-slim.utb}
table: ancient-languages-borger.utb
table: ancient-languages-us.utb
flags: { testmode: forward }
tests:
  - ["בראשית", "⠧⠗⠁⠩⠚⠹"]
  - ["אלהים", "⠁⠇⠓⠚⠍"]
  - ["הארץ", "⠓⠁⠗⠮"]
  - ["היתה", "⠓⠚⠹⠓"]
  - ["והארץ", "⠺⠓⠁⠗⠮"]
  - ["המים", "⠓⠍⠚⠍"]

table: hbo-common-rules.uti # includes he-common-vowels-ihbc.uti, but he-common-vowels-ihbc.uti does not function on its own
table: {language: hbo, system: IHBC, __assert-match: hbo.utb}
table: {language: hbo, system: IHBC-McAllister, __assert-match: hbo-cantillated.utb}
table: ancient-languages-borger.utb
table: ancient-languages-us.utb
flags: { testmode: forward }
tests:
  - ["בְּרֵאשִׁית", "⠃⠄⠗⠌⠁⠩⠔⠹"]
  - ["אֱלֹהִים", "⠁⠢⠇⠕⠓⠔⠍"]
  - ["הָאָרֶץ", "⠓⠣⠁⠣⠗⠑⠮"]
  - ["הָיְתָה", "⠓⠣⠚⠄⠹⠣⠓"]
  - ["וְהָאָרֶץ", "⠺⠄⠓⠣⠁⠣⠗⠑⠮"]
  - ["הַמָּיִם", "⠓⠉⠐⠍⠣⠚⠊⠍"]

# Regression test for the shuruq / consonantal-waw rule in
# hbo-common-rules.uti. A shuruq (⠬, dots 346) must only be produced from
# the Hebrew "ּו" sequence. When the Hebrew rules are combined with another
# language, a cell that merely happens to be dots 346 must not be rewritten
# into dagesh+waw (⠐⠺) just because the next cell carries the Hebrew "vowel"
# attribute. Here digit 0 = dots 346 and digit 2 = dots 126 (as Hebrew
# qamats), so "02" must stay ⠬⠣ and not become ⠐⠺⠣.
table: hbo-ihbc-rules.uti,digits6DotsPlusDot6.uti,braille-patterns.cti
flags: { testmode: forward }
tests:
  - ['02', '⠬⠣']
