    - "⠘⠜⠑⠗⠜⠕⠺⠙⠑⠝⠂⠳⠺⠑⠵⠙⠁⠂⠌⠑⠗⠅⠁⠂⠣⠥⠃⠕⠺⠂⠫⠊⠺⠁⠂⠻⠑⠃⠂⠯⠁⠲"
  # No space after a comma or a semicolon
  - - "так, ні; можливо"
    - "⠞⠁⠅⠂⠝⠽⠆⠍⠕⠚⠇⠊⠺⠕"
  # After a digit the space after a comma is kept (a comma keeps numeric mode)
  - - "1, 2, 3 і 5, а"
    - "⠼⠁⠂ ⠼⠃⠂ ⠼⠉ ⠽ ⠼⠑⠂ ⠁"
  - - "1,5 і 2024; так"
    - "⠼⠁⠂⠑ ⠽ ⠼⠃⠚⠃⠙⠆⠞⠁⠅"

flags: {testmode: backward}
tests:
  - - "⠘⠺⠕⠝⠁ ⠍⠗⠽⠜ ⠏⠗⠕ ⠵⠽⠺⠄⠫⠇⠑ ⠇⠊⠎⠞⠫ ⠝⠁ ⠻⠁⠝⠅⠥⠂⠁⠇⠑ ⠹⠹ ⠍⠗⠽⠹ ⠝⠑ ⠵⠃⠥⠺⠁⠳⠞⠾⠎⠫⠲"
    - "Вона мріє про зів'яле листя на ґанку, але її мрії не збуваються."
  - - "⠘⠅⠊⠹⠺⠂⠘⠘⠹⠚⠁⠅⠂⠘⠻⠁⠝⠕⠅⠂⠘⠜⠝⠕⠞"
    - "Київ, ЇЖАК, Ґанок, Єнот"
  - - "⠘⠉⠽⠝⠁ ⠼⠉⠂⠁⠙ ⠛⠗⠝"
    - "Ціна 3,14 грн"
  - - "⠃⠥⠙⠊⠝⠕⠅ ⠼⠑⠐⠁"
    - "будинок 5а"
  - - "⠘⠭⠕⠢ ⠘⠞⠁⠅⠖ ⠘⠝⠽⠒ ⠞⠁⠅⠆⠝⠽⠲"
    - "Що? Так! Ні: так; ні."
  # A space typed after a comma is not doubled
  - - "⠞⠁⠅⠂ ⠝⠽"
    - "так, ні"
  - - "⠼⠁⠂ ⠼⠃⠂ ⠼⠉"
    - "1, 2, 3"
  - - "⠼⠃⠚⠃⠙⠆⠞⠁⠅"
    - "2024; так"
  # Latin input on a Perkins keyboard: dot 6 before a word, 46 for a capital
  - - "⠠⠺⠊⠝⠙⠕⠺⠎"
    - "windows"
  - - "⠨⠺⠕⠗⠙ ⠽ ⠏⠗⠊⠺⠽⠞"
    - "Word і привіт"
  - - "⠠⠏⠁⠎⠎⠺⠕⠗⠙⠼⠁⠃⠉"
    - "password123"
  # One dot 6 is enough for a whole e-mail address
  - - "⠠⠊⠝⠋⠕⠩⠞⠗⠕⠎⠞⠊⠲⠉⠕⠍⠲⠥⠁"
    - "info@trosti.com.ua"
  - - "⠠⠙⠕⠝⠄⠞ ⠁⠃"
    - "don't аб"
  # Brackets typed with dot 6 still work
  - - "⠠⠷"
    - "["
  # Russian letters typed out of habit give the Ukrainian equivalent
  - - "⠏⠕⠪⠞ ⠍⠮"
    - "поет ми"
  - - "⠏⠕⠙⠷⠑⠵⠙"
    - "под'езд"
  - - "⠡⠇⠅⠁ ⠇⠡⠝ ⠏⠗⠊⠡⠍"
    - "йолка льон прийом"
  # Other cells without a meaning produce nothing
  - - "⠁⠬⠁"
    - "аа"

