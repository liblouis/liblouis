  - ['rdp://host', ⠗⠙⠏⠒⠸⠌⠸⠌⠓⠕⠌]
  - ['host.example.org:8080/path', ⠓⠕⠌⠲⠑⠭⠁⠍⠏⠇⠑⠲⠕⠗⠛⠒⠼⠓⠚⠓⠚⠸⠌⠏⠁⠞⠓]
