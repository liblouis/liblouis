# Examples from the Rules of Unified English Braille 2024, section 10.12.3,
# whose forward translation differs from the rulebook.
flags: {testmode: backward}
tests:
  - [⠉⠒⠸⠡⠃⠗⠁⠊⠇⠇⠑⠙⠕⠉⠥⠰⠞⠎⠸⠡⠇⠑⠞⠞⠻⠎⠲⠞⠭⠞, 'c:\\brailledocuments\\letters.txt']
