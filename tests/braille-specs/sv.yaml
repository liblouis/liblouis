display: |
  include unicode-without-blank.dis
  display a a

# ----------------------------------
# 6-dot grade 0, uncontracted, normal
# ----------------------------------

table:
  language: sv
  grade: 0
  dots: 6
  variant: normal
  __assert-match: sv-g0.utb
flags: {testmode: bothDirections}
tests:
  - # Lowercase letters
    - a b c d e f g h i j k l m n o p q r s t u v w x y z
    - ⠁ ⠃ ⠉ ⠙ ⠑ ⠋ ⠛ ⠓ ⠊ ⠚ ⠅ ⠇ ⠍ ⠝ ⠕ ⠏ ⠟ ⠗ ⠎ ⠞ ⠥ ⠧ ⠺ ⠭ ⠽ ⠵
  - # Single digits
    - 1 2 3 4 5 6 7 8 9 0
    - ⠼⠁ ⠼⠃ ⠼⠉ ⠼⠙ ⠼⠑ ⠼⠋ ⠼⠛ ⠼⠓ ⠼⠊ ⠼⠚
  - # Capitalization
    - Hej!
    - ⠠⠓⠑⠚⠖
  - # All caps word
    - NHL
    - ⠠⠠⠝⠓⠇
  - # Mixed letters and numbers
    - 123abc
    - ⠼⠁⠃⠉⠱⠁⠃⠉
  - # Decimal point
    - 10,35
    - ⠼⠁⠚⠂⠉⠑
  - # Number series
    - 192.168.0.1
    - ⠼⠁⠊⠃⠄⠁⠋⠓⠄⠚⠄⠁
  - # Time
    - 15:35
    - ⠼⠁⠑⠒⠼⠉⠑
  # Spaces
  - ['\x0020', ' ']
  - ['\x0009', '\x0020', {xfail: {backward: true}}]
  - ['\x000a', '\x0020', {xfail: {backward: true}}]
  - ['\x000d', '\x0020', {xfail: {backward: true}}]
  - ['\x00a0', '\x0020', {xfail: {backward: true}}]
  - # Generic diacritic letters
    - ă ɖ ḝ
    - ⠈⠁ ⠲⠙ ⠈⠑
    - xfail: {backward: true}
  # All caps phrase
  - - VAD SÄGER DU?
    - ⠠⠠⠠⠧⠁⠙ ⠎⠜⠛⠑⠗ ⠙⠥⠢⠱

# ----------------------------------
# 6-dot grade 0, uncontracted, detailed
# ----------------------------------

table:
  language: sv
  grade: 0
  dots: 6
  variant: detailed
  __assert-match: sv-6g0d.utb
flags: {testmode: bothDirections}
tests:
  - # Diacritic letters
    - ć ì ó ţ ẅ
    - ⠬⠔⠉ ⠬⠢⠊ ⠬⠔⠕ ⠣⠂⠞ ⠬⠆⠺

# ----------------------------------
# 6-dot grade 1, partially contracted, detailed
# ----------------------------------

table:
  language: sv
  grade: 1
  dots: 6
  variant: normal
  __assert-match: sv-g1.ctb
flags: {testmode: bothDirections}
tests:
  - # Non-contraction letters
    - Nej s som i Sigurd.
    - ⠠⠝⠑⠚ ⠒⠎ ⠎ ⠊ ⠠⠎⠊⠛⠥⠗⠙⠄
  - # All caps phrase
    - VAD SÄGER DU?
    - ⠠⠠⠠⠺ ⠎⠜⠛⠑⠗ ⠙⠥⠢⠱
    - xfail: {backward: true}

# ----------------------------------
# 6-dot grade 2, fully contracted, detailed
# ----------------------------------

table:
  language: sv
  grade: 2
  dots: 6
  variant: normal
  __assert-match: sv-g2.ctb
flags: {testmode: bothDirections}
tests:
  - # Part-word contraction
    - Han sa att de kunde ingenting.
    - ⠠⠓ ⠎⠁ ⠁ ⠹ ⠅⠹ ⠊⠣⠞⠦⠄
  - # Two-word contraction
    - Du kan till exempel gå till affären.
    - ⠠⠙⠥ ⠅ ⠞⠤⠑⠭ ⠛⠡ ⠞ ⠁⠋⠋⠜⠗⠑⠝⠄

# ----------------------------------
# 8-dot grade 0 (uncontracted) normal
# ----------------------------------

table:
  language: sv
  dots: 8
  grade: 0
  variant: normal
  __assert-match: sv-8g0n.utb
flags: {testmode: bothDirections}
tests:
  - # Lowercase letters
    - a b c d e f g h i j k l m n o p q r s t u v w x y z
    - ⠁ ⠃ ⠉ ⠙ ⠑ ⠋ ⠛ ⠓ ⠊ ⠚ ⠅ ⠇ ⠍ ⠝ ⠕ ⠏ ⠟ ⠗ ⠎ ⠞ ⠥ ⠧ ⠺ ⠭ ⠽ ⠵
  - # Digits
    - 1 2 3 4 5 6 7 8 9 0
    - ⢁ ⢃ ⢉ ⢙ ⢑ ⢋ ⢛ ⢓ ⢊ ⢚
  - # Capitalization
    - Hej!
    - ⡓⠑⠚⠖
  - # All caps word
    - NHL
    - ⡝⡓⡇
  - # Diacritic letters
    - ă ć ɖ ì ó ţ ẅ ḝ
    - ⠈⠁ ⠈⠉ ⠲⠙ ⠈⠊ ⠈⠕ ⠈⠞ ⠈⠺ ⠈⠑
    - xfail: {backward: true}

# ----------------------------------
# 8-dot grade 1 (partially contracted) normal
# ----------------------------------

table:
  language: sv
  dots: 8
  grade: 1
  variant: normal
  __assert-match: sv-8g1n.ctb
flags: {testmode: bothDirections}
tests:
  - # One-letter contractions
    - och vad han har att vid
    - ⠉ ⠺ ⠓ ⠗ ⠁ ⠧
  - # One-letter contractions with capital signs
    - Och Vad Han Har Att Vid
    - ⡉ ⡺ ⡓ ⡗ ⡁ ⡧

# ----------------------------------
# 8-dot grade 2 (contracted) normal
# ----------------------------------

table:
  language: sv
  dots: 8
  grade: 2
  variant: normal
  __assert-match: sv-8g2n.ctb
flags: {testmode: bothDirections}
tests:
  - # Two-letter contractions
    - hon allt endast måste några själva tillbaka ingen bland annat
    - ⠓⠝ ⠁⠞ ⠑⠁ ⠍⠳ ⠝⠺ ⠎⠚⠁ ⠞⠃ ⠊⠣ ⠃⠇⠤⠁
  - # Multi-letter contractions with capital signs
    - Hon Allt Endast Måste Några Själva Tillbaka Ingen Bland annat
    - ⡓⠝ ⡁⠞ ⡑⠁ ⡍⠳ ⡝⠺ ⡎⠚⠁ ⡞⠃ ⡊⠣ ⡃⠇⠤⠁

