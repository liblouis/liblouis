table:
  language: sv
  dots: 8
  grade: 0
  variant: detailed
  __assert-match: sv-8g0d.utb
flags: {testmode: bothDirections}
tests:
  - # Lowercase letters
    - a b c d e f g h i j k l m n o p q r s t u v w x y z
    - ⠁ ⠃ ⠉ ⠙ ⠑ ⠋ ⠛ ⠓ ⠊ ⠚ ⠅ ⠇ ⠍ ⠝ ⠕ ⠏ ⠟ ⠗ ⠎ ⠞ ⠥ ⠧ ⠺ ⠭ ⠽ ⠵
  - # Digits
    - 1 2 3 4 5 6 7 8 9 0
    - ⢁ ⢃ ⢉ ⢙ ⢑ ⢋ ⢛ ⢓ ⢊ ⢚
  - # Capitalization
    - Hej!
    - ⡓⠑⠚⠖
  - # All caps word
    - NHL
    - ⡝⡓⡇
  - # Diacritic letters
    - ă ć ɖ ì ó ţ ẅ ḝ
    - ⠬⠰⠁ ⠬⠔⠉ ⠲⠙ ⠬⠢⠊ ⠬⠔⠕ ⠣⠂⠞ ⠬⠆⠺ ⠬⠰⠣⠂⠑

# ----------------------------------
