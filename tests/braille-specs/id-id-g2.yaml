  - - "Sinar X"
    - "⠠⠎⠶⠁⠗⠀⠰⠠⠭"
  - - "kelas 3A"
    - "⠹⠇⠁⠎⠀⠼⠉⠰⠠⠁"
  - - "kelas 2b"
    - "⠹⠇⠁⠎⠀⠼⠃⠰⠃"
  - - "a.n. kepala sekolah"
    - "⠁⠲⠝⠲⠀⠹⠏⠈⠇⠀⠯⠅⠕⠸"
  - - "A.H. Nasution"
    - "⠠⠁⠲⠠⠓⠲⠀⠠⠝⠁⠎⠥⠞⠊⠕⠝"
  - - "DPR MPR"
    - "⠠⠠⠙⠏⠗⠀⠠⠠⠍⠏⠗"
  - - "siang/malam dan/atau lentera/dian"
    - "⠎⠔⠻⠌⠍⠈⠇⠍⠀⠜⠌⠪⠀⠇⠑⠝⠴⠁⠌⠌⠜"
    - xfail: {backward: "Dots 3-4 between letters are read as di; only dan/atau is read with the slash."}
  - - "SMU"
    - "⠠⠠⠎⠍⠥"
    - xfail: {forward: "Abbreviations in capitals are not recognised, so mu is contracted."}
  - - "I II III"
    - "⠠⠊⠀⠠⠠⠊⠊⠀⠠⠠⠊⠊⠊"
    - xfail: {forward: "A single capital I is taken as a letter and gets the letter sign.", backward: "Without the letter sign, I is the word sign itu."}
  - - "i ii iii"
    - "⠰⠊⠀⠰⠊⠊⠀⠰⠊⠊⠊"
    - xfail: {forward: "Only a single letter gets the letter sign, not ii or iii."}
  # Choosing between contractions (Modul 6.4.3, rules and Latihan 6.4)
  - - "makan kunci cahaya tanah tanda"
    - "⠍⠁⠷⠀⠾⠝⠉⠊⠀⠉⠈⠓⠽⠁⠀⠞⠜⠁⠓⠀⠞⠸⠁"
  - - "bangun hanyut landai"
    - "⠃⠻⠝⠀⠓⠁⠫⠥⠞⠀⠇⠜⠙⠡"
  - - "kepandaian keteraturan berkeberatan berserakan"
    - "⠹⠏⠜⠙⠡⠜⠀⠹⠴⠘⠁⠜⠀⠖⠹⠖⠁⠞⠜⠀⠖⠯⠗⠁⠷"
  - - "pengakuan penandatanganan keharusan perbaikan"
