  - - "mudah murah tamu gemuk"
    - "⠩⠙⠁⠓⠀⠩⠗⠁⠓⠀⠞⠁⠩⠀⠛⠑⠩⠅"
  - - "Taufik aura kemarau"
    - "⠠⠞⠪⠋⠊⠅⠀⠪⠗⠁⠀⠹⠍⠁⠗⠪"
  - - "kena kemah sekedar tiket kecap"
    - "⠹⠝⠁⠀⠹⠍⠁⠓⠀⠯⠹⠙⠁⠗⠀⠞⠊⠹⠞⠀⠹⠉⠁⠏"
  - - "pasti nista Hesti"
    - "⠏⠁⠱⠊⠀⠝⠊⠱⠁⠀⠠⠓⠑⠱⠊"
  - - "teliti motel sate ketel ketemu"
