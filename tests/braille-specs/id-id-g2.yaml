  - - "tenang menangis renang angkat"
    - "⠳⠝⠁⠻⠀⠢⠝⠁⠻⠊⠎⠀⠗⠑⠝⠁⠻⠀⠁⠻⠅⠁⠞"
  - - "memaki memeriksa pamer opname reklame"
    - "⠢⠍⠁⠅⠊⠀⠢⠢⠗⠊⠅⠎⠁⠀⠏⠁⠢⠗⠀⠕⠏⠝⠁⠢⠀⠗⠑⠅⠇⠁⠢"
  - - "Ria kiat tiap setia agraria"
    - "⠠⠗⠔⠀⠅⠔⠞⠀⠞⠔⠏⠀⠯⠞⠔⠀⠁⠛⠗⠁⠗⠔"
  - - "pekan ikan kantor kantong kampak kambuh"
    - "⠏⠑⠷⠀⠊⠷⠀⠷⠞⠕⠗⠀⠷⠞⠕⠻⠀⠷⠏⠁⠅⠀⠷⠃⠥⠓"
    - xfail: {forward: "The course writes the p and e of pekan as letters; the table uses the sign for pe."}
  - - "akui saku kuku Kudus"
    - "⠁⠾⠊⠀⠎⠁⠾⠀⠾⠾⠀⠠⠾⠙⠥⠎"
  - - "Danti Wildan antar andong amplop ambil uban keran Sultan"
    - "⠠⠙⠜⠞⠊⠀⠠⠺⠊⠇⠙⠜⠀⠜⠞⠁⠗⠀⠜⠙⠕⠻⠀⠜⠏⠇⠕⠏⠀⠜⠃⠊⠇⠀⠥⠃⠜⠀⠹⠗⠜⠀⠠⠎⠥⠇⠞⠜"
  - - "Didi padi"
    - "⠠⠌⠌⠀⠏⠁⠌"
  - - "sesampai Aisyah rantai pantai gulai"
    - "⠯⠸⠡⠀⠠⠡⠎⠽⠁⠓⠀⠗⠜⠞⠡⠀⠏⠜⠞⠡⠀⠛⠥⠇⠡"
  # Repetition (Modul 6.1.2): the repeat sign after the word, dots 4-5-6
  # before a repeated single-cell word sign, a hyphen after a prefix and
  # the suffix after the repeat sign.
  - - "ibu-ibu ayam-ayam mobil-mobil"
    - "⠊⠃⠥⠣⠀⠈⠽⠍⠣⠀⠍⠃⠇⠣"
  - - "bagi-bagi bagian-bagian"
    - "⠸⠃⠣⠀⠸⠃⠜⠣"
  - - "berlari-lari terbagi-bagi sehari-hari"
    - "⠖⠤⠇⠁⠗⠊⠣⠀⠴⠤⠸⠃⠣⠀⠯⠤⠐⠓⠣"
  - - "berhati-hatilah sedalam-dalamnya"
    - "⠖⠤⠓⠞⠣⠸⠀⠯⠤⠐⠙⠣⠮"
  - - "satu-satunya seakan-akan sampai-sampai"
    - "⠸⠱⠣⠮⠀⠯⠤⠸⠷⠣⠀⠸⠡⠣"
  - - "kupu-kupu padi-padian sia-sia"
    - "⠾⠏⠥⠣⠀⠏⠁⠌⠣⠜⠀⠎⠔⠣"
  - - "sekurang-kurangnya"
    - "⠯⠤⠘⠅⠣⠮"
  - - "Jakarta-Ambon"
    - "⠠⠚⠈⠅⠗⠞⠁⠤⠠⠜⠃⠕⠝"
  - - "kasak-kusuk"
    - "⠅⠈⠎⠅⠤⠾⠎⠥⠅"
    - xfail: {forward: "liblouis takes the k before the hyphen as a repeated root."}
  # Part-word signs for the start and the middle of a word (Modul 6.2.1).
  # At the end ber, per and ter are written be-r, pe-r and te-r.
  - - "Suster, ambilkan air bersih dari ember!"
    - "⠠⠎⠥⠎⠳⠗⠂⠀⠜⠃⠊⠇⠷⠀⠡⠗⠀⠖⠎⠊⠓⠀⠙⠀⠑⠍⠆⠗⠖"
  - - "Mentari sudah terbenam; pelaut itu akan pergi."
    - "⠠⠢⠝⠞⠁⠗⠊⠀⠘⠎⠀⠴⠆⠝⠁⠍⠆⠀⠒⠇⠪⠞⠀⠊⠀⠷⠀⠲⠛⠊⠲"
  - - "benar kebenaran bela dibela"
    - "⠆⠝⠁⠗⠀⠹⠆⠝⠁⠗⠜⠀⠆⠇⠁⠀⠌⠆⠇⠁"
  - - "Pengacara peluru pedas sepeda"
    - "⠠⠒⠻⠁⠸⠉⠀⠒⠇⠥⠗⠥⠀⠒⠙⠁⠎⠀⠯⠒⠙⠁"
  - - "teratur terampil keterampilan veteran semester"
    - "⠴⠘⠁⠀⠴⠜⠏⠊⠇⠀⠹⠴⠜⠏⠊⠇⠜⠀⠧⠑⠴⠜⠀⠯⠢⠎⠳⠗"
  - - "berenang seberkas seberang November Desember"
    - "⠖⠑⠝⠁⠻⠀⠯⠖⠅⠁⠎⠀⠯⠖⠁⠻⠀⠠⠝⠕⠧⠑⠍⠆⠗⠀⠠⠙⠑⠯⠍⠆⠗"
  - - "persis perdana perang berperang properti operasi"
    - "⠲⠎⠊⠎⠀⠲⠙⠜⠁⠀⠲⠁⠻⠀⠖⠲⠁⠻⠀⠏⠗⠕⠲⠞⠊⠀⠕⠲⠁⠎⠊"
  # Part-word signs for the middle of a word (Modul 6.2.2)
  - - "Aam maaf faal taat manfaat"
    - "⠠⠁⠁⠍⠀⠍⠂⠋⠀⠋⠂⠇⠀⠞⠂⠞⠀⠍⠜⠋⠂⠞"
  - - "intan minum pimpin timbul muslim induk"
    - "⠊⠝⠞⠜⠀⠍⠶⠥⠍⠀⠏⠶⠏⠊⠝⠀⠞⠶⠃⠥⠇⠀⠩⠎⠇⠊⠍⠀⠊⠝⠙⠥⠅"
  - - "Aminah mimpi rindu bimbang pindah rimbun"
    - "⠠⠁⠍⠶⠁⠓⠀⠍⠶⠏⠊⠀⠗⠶⠙⠥⠀⠃⠶⠃⠁⠻⠀⠏⠶⠙⠁⠓⠀⠗⠶⠃⠥⠝"
  - - "unta gunung rumit kebun tumbuh tumpul"
    - "⠥⠝⠞⠁⠀⠛⠦⠥⠻⠀⠗⠥⠍⠊⠞⠀⠹⠃⠥⠝⠀⠞⠦⠃⠥⠓⠀⠞⠦⠏⠥⠇"
  - - "Untung beruntung buntut bumbu sumpah Bunda"
    - "⠠⠥⠝⠞⠥⠻⠀⠖⠦⠞⠥⠻⠀⠃⠦⠞⠥⠞⠀⠃⠦⠃⠥⠀⠎⠦⠏⠁⠓⠀⠠⠃⠦⠙⠁"
  - - "manggis canggih panggung nggak Singgih"
