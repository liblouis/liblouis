display: unicode.dis
table:
  language: id
  type: literary
  contraction: full
  __assert-match: id-id-g2.ctb

flags: {testmode: bothDirections}
tests:
  # Word signs: letters (Modul 5.1.1). They stand alone and may carry
  # punctuation and the capital sign.
  - - "Emas ini untuk anda lagi."
    - "⠠⠑⠀⠝⠀⠥⠀⠁⠀⠛⠲"
  - - "Lagi-lagi saya cemas karena aksi bandar itu."
    - "⠠⠸⠛⠣⠀⠎⠀⠉⠸⠑⠀⠗⠀⠭⠀⠃⠸⠁⠗⠀⠊⠲"
  # Word signs: reversed letters (Modul 5.1.2)
  - - "Jangan kamu buat mereka sebagai saksi!"
    - "⠠⠻⠀⠩⠀⠬⠀⠍⠀⠼⠀⠎⠸⠭⠖"
  - - "Jangan-jangan kamus itu untuk Nanda."
    - "⠠⠸⠻⠣⠀⠸⠩⠎⠀⠊⠀⠥⠀⠠⠝⠸⠁⠲"
  # Word signs: lower signs (Modul 5.1.3). They are used only between
  # spaces; next to a punctuation mark the word is written in letters.
  - - "Memang ia yang buat agar-agar."
    - "⠠⠢⠀⠔⠀⠽⠀⠬⠀⠁⠛⠁⠗⠣⠲"
  - - "\"Ia masih lemas.\""
    - "⠦⠠⠊⠁⠀⠦⠀⠇⠸⠑⠲⠴"
  - - "Pagar ini memang masih kokoh."
    - "⠠⠏⠈⠛⠗⠀⠝⠀⠢⠀⠦⠀⠅⠕⠅⠕⠓⠲"
  # Word signs: other signs (Modul 5.1.4). ke, ia and di are also
  # part-word signs.
  - - "Aku akan di sini sampai sore."
    - "⠠⠾⠀⠷⠀⠌⠀⠎⠶⠊⠀⠡⠀⠎⠕⠗⠑⠲"
  - - "Tiba di kelas, ia dikejar Nia sampai ke kebun."
    - "⠠⠞⠃⠀⠌⠀⠹⠇⠁⠎⠂⠀⠔⠀⠌⠹⠚⠁⠗⠀⠠⠝⠔⠀⠡⠀⠹⠀⠹⠃⠥⠝⠲"
  # Word signs with dot 5 (Modul 5.2)
  - - "Karena kerja yang berat, Haris jadi sangat capai."
    - "⠠⠗⠀⠐⠹⠀⠽⠀⠖⠁⠞⠂⠀⠠⠐⠓⠎⠀⠚⠀⠐⠎⠀⠐⠉⠲"
  - - "Dini dan Dirin tinggal di Kalimas."
    - "⠠⠌⠝⠊⠀⠜⠀⠠⠐⠌⠝⠀⠐⠿⠀⠌⠀⠠⠐⠅⠍⠁⠎⠲"
  # Word signs with dots 4-5 (Modul 5.3)
  - - "Catur ini khusus untuk tunanetra."
    - "⠠⠉⠘⠁⠀⠝⠀⠘⠟⠀⠥⠀⠘⠱⠲"
  - - "Pak Wiguna diganggu orang di Cianjur."
    - "⠠⠏⠁⠅⠀⠠⠺⠊⠘⠛⠀⠌⠘⠿⠀⠐⠕⠀⠌⠀⠠⠉⠊⠘⠜⠲"
  # Word signs with dot 4 (Modul 5.4.1)
  - - "Pribadi pak Darus aneh dan abnormal."
    - "⠠⠏⠗⠊⠃⠁⠌⠀⠏⠁⠅⠀⠠⠙⠈⠥⠀⠈⠑⠀⠜⠀⠈⠕⠲"
  # Word signs with dots 3-4-5-6 (Modul 5.4.2)
  - - "Selesai kerja, semua orang keluar sekaligus."
    - "⠠⠼⠡⠀⠐⠹⠂⠀⠼⠬⠀⠐⠕⠀⠹⠘⠇⠀⠼⠅⠛⠥⠎⠲"
  # Free part-word signs (Modul 6.1.1, examples and Latihan 6.1)
  - - "Aku tahu kucingku akan makan tikus di gudang padi."
    - "⠠⠾⠀⠐⠞⠀⠾⠉⠊⠻⠾⠀⠷⠀⠍⠁⠷⠀⠞⠊⠾⠎⠀⠌⠀⠛⠥⠙⠁⠻⠀⠏⠁⠌⠲"
  - - "Fuad telah mengambil sate kambing di kantin buat anaknya."
