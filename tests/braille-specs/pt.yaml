# Tests for Portuguese tables
#
# Characters according to the books: "Grafia Braille para a Língua Portuguesa"
# [Braille Writing for the Portuguese Language], 2002;
# "Grafia Braille para Informática" [Braille Writing for Computing], 2004;
# "Grafia Matemática Braille" [Braille Mathematics Writing], 1994;
# "Normas Técnicas para a Produção de Textos em Braille"
# [Standards for the Production of Braille texts], 2002.

display: unicode-without-blank.dis

# Common character tests for grade 1, and 8-dot/6-dot computer Braille Tables

table:
  language: pt
  grade: 1
  __assert-match: pt-pt-g1.utb
table:
  language: pt
  type: computer
  dots: 8
  __assert-match: pt-pt-comp8.ctb
table:
  language: pt
  type: computer
  dots: 6
  __assert-match: pt-comp6.utb

flags: {testmode: bothDirections}
tests:
  - ['"', "⠦"]
  - [",", "⠂"]
  - ["-", "⠤"]
  - [".", "⠄"]
  - [":", "⠒"]
  - [";", "⠆"]
  - ["=", "⠶"]
  - ["?", "⠢"]
  - ["@", "⠱"]
  - ["a", "⠁"]
  - ["b", "⠃"]
  - ["c", "⠉"]
  - ["d", "⠙"]
  - ["e", "⠑"]
  - ["f", "⠋"]
  - ["g", "⠛"]
  - ["h", "⠓"]
  - ["i", "⠊"]
  - ["j", "⠚"]
  - ["k", "⠅"]
  - ["l", "⠇"]
  - ["m", "⠍"]
  - ["n", "⠝"]
  - ["o", "⠕"]
  - ["p", "⠏"]
  - ["q", "⠟"]
  - ["r", "⠗"]
  - ["s", "⠎"]
  - ["t", "⠞"]
  - ["u", "⠥"]
  - ["v", "⠧"]
  - ["w", "⠺"]
  - ["x", "⠭"]
  - ["y", "⠽"]
  - ["z", "⠵"]
  - ["°", "⠴"]
  - ["à", "⠫"]
  - ["á", "⠷"]
  - ["â", "⠡"]
  - ["ã", "⠜"]
  - ["ç", "⠯"]
  - ["é", "⠿"]
  - ["ê", "⠣"]
  - ["í", "⠌"]
  - ["ó", "⠬"]
  - ["ô", "⠹"]
  - ["õ", "⠪"]
  - ["ú", "⠾"]
  - ["ü", "⠳"]

flags: {testmode: forward}
tests:
  - ["‐", "⠤"]
  - ["“", "⠦"]	# back-translates as U+0022
  - ["”", "⠦"]	# back-translates as U+0022
  - ["−", "⠤"]

