# See documentation in en-nz-g1.ctb for specification.
display: unicode.dis
table:
  language: en-nz
  grade: 2
  system: ueb-nz
  __assert-match: en-nz-g2.ctb
flags: {testmode: bothDirections}
tests:
  - [ā, ⠸⠁] # lowercase a macron
  - [ē, ⠸⠑] # lowercase e macron
  - [ī, ⠸⠊] # lowercase i macron
  - [ō, ⠸⠕] # lowercase o macron
  - [ū, ⠸⠥] # lowercase u macron
  - [Ā, ⠠⠸⠁] # uppercase A macron
  - [Ē, ⠠⠸⠑] # uppercase E macron
  - [Ī, ⠠⠸⠊] # uppercase I macron
  - [Ō, ⠠⠸⠕] # uppercase O macron
  - [Ū, ⠠⠸⠥] # uppercase U macron
# A word in lower case, an odd mixed case and fully upper case
  - [kāpō, ⠅⠸⠁⠏⠸⠕] # lower case
  - [kāpŌ, ⠅⠸⠁⠏⠠⠸⠕] # odd mixed casing where only the last character is in upper case
  - [KĀPŌ, ⠠⠠⠅⠸⠁⠏⠸⠕] # fully upper case
# Demonstrate that an a-macron followed by r is not turned into an ar contraction.
  - [whangārei, ⠱⠁⠝⠛⠸⠁⠗⠑⠊]
  - [WhangĀrei, ⠠⠱⠁⠝⠛⠠⠸⠁⠗⠑⠊]
  - [WHANGĀREI, ⠠⠠⠱⠁⠝⠛⠸⠁⠗⠑⠊]

